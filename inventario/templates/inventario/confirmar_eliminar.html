{% extends 'inventario/base.html' %}

{% block title %}Confirmar Eliminar Producto{% endblock %}

{% block content %}
<h2 class="text-center mb-4">⚠️ ¿Deseas eliminar {{ producto.nombre }}?</h2>
<div class="card p-4 bg-white shadow text-center">
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
        <a href="{% url 'inventario:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
