{% extends 'inventario/base.html' %}

{% block title %}Crear / Editar Producto{% endblock %}

{% block content %}
<h2 class="text-center mb-4">➕ Crear o Modificar Producto</h2>
<div class="card p-4 bg-white shadow">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'inventario:lista' %}" class="btn btn-secondary">Volver</a>
    </form>
</div>
{% endblock %}
